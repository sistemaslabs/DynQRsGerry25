<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando…</title>

  <style>
    /* Colores por defecto: gris neutro. Si la URL trae &m=<marca>, o si el
       Apps Script devuelve el tema, estos valores se sustituyen al vuelo. */
    :root {
      --prim:  #6b7280;
      --texto: #4b5563;
      --pista: #d7dbe0;
      --t1:    #ffffff;
      --t2:    #eceef1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 42%, #ffffff 0%, var(--t1) 48%, var(--t2) 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
      color: var(--texto);
      overflow: hidden;
      transition: background 260ms ease;
    }

    #loading { display: flex; flex-direction: column; justify-content: center; align-items: center; }

    /* Caja fija para el logo: cada marca ajusta su alto y ancho maximos, y
       object-fit lo encaja sin deformarlo. Arranca invisible y aparece con
       un fundido cuando la imagen termina de cargar. */
    .logo-caja { height: 130px; display: flex; align-items: center; justify-content: center; }
    #logo {
      max-height: 0; max-width: 0;
      object-fit: contain;
      opacity: 0;
      transition: opacity 320ms ease;
    }
    #logo.visible { opacity: 1; }

    .spinner {
      width: 38px; height: 38px;
      margin-top: 26px;
      border: 3px solid var(--pista);
      border-left-color: var(--prim);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      transition: border-color 260ms ease;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-text {
      margin-top: 17px;
      font-size: 11px;
      letter-spacing: 2.6px;
      font-weight: 600;
      text-transform: uppercase;
      opacity: .85;
      transition: color 260ms ease;
    }

    .progress-bar {
      width: 150px; height: 2px;
      margin-top: 14px;
      border-radius: 2px;
      background: var(--pista);
      position: relative;
      overflow: hidden;
    }
    .progress-bar::after {
      content: '';
      position: absolute;
      left: -100%; width: 100%; height: 100%;
      background: var(--prim);
      animation: loading 1.9s infinite;
    }
    @keyframes loading { 0% { left: -100%; } 100% { left: 100%; } }

    /* Pantalla de error */
    #msgError { display: none; flex-direction: column; align-items: center; gap: 14px; padding: 0 26px; }
    #msgError svg { width: 46px; height: 46px; stroke: var(--prim); fill: none; stroke-width: 1.7; }
    #msgTexto { font-size: 14px; letter-spacing: .4px; text-align: center; max-width: 340px; line-height: 1.55; margin: 0; }
  </style>
</head>
<body>

  <!-- ── Pantalla de carga ────────────────────────────────────────────── -->
  <div id="loading">
    <div class="logo-caja"><img id="logo" alt=""></div>
    <div class="spinner"></div>
    <div class="status-text">Validando acceso</div>
    <div class="progress-bar"></div>
  </div>

  <!-- ── Pantalla de error ────────────────────────────────────────────── -->
  <!-- Va ANTES del <script> a proposito: cuando falta 'k' se llama a
       mostrarError() de forma sincrona y el div ya tiene que existir. -->
  <div id="msgError">
    <svg id="msgIcono" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
    </svg>
    <p id="msgTexto">QR no disponible en este momento.</p>
  </div>

  <script>
        const AS_URL_BASE = "https://script.google.com/macros/s/AKfycbwUTvyp75BSJThEnCDf281dsWJYhI_jWRJsf5Qz5smoVnCN7x4QperaOd9sCOxtDsMC/exec";

        var params  = new URLSearchParams(document.location.search);
        var k       = params.get('k');
        var m       = params.get('m');            // marca, para pintar de inmediato

        // 14/08/2026: se elimino la variable 'dominio' y el parametro &d= que
        // se le mandaba al Apps Script. Siempre valia "sistemaslabs.github.io"
        // —el dominio de ESTA pagina, no el del visitante— asi que la columna
        // DominioVisitante del historial nunca guardo lo que su nombre dice.

        // ─── MARCAS ────────────────────────────────────────────────────────
        // Cada marca de la columna Dominio del Sheet tiene su paleta y su logo.
        // Los logos viven en la carpeta logos/ de este mismo repo.
        var TEMAS = {
                eurotecsa: { prim:"#d81818", texto:"#8e0f0f", pista:"#f4bebe", t1:"#fbe8e8", t2:"#f5c3c3", ancho:300, alto:92  },
                gsi:       { prim:"#0091c7", texto:"#00607f", pista:"#b8e0ef", t1:"#e6f4f9", t2:"#bde2f0", ancho:300, alto:132 },
                systemi:   { prim:"#0096be", texto:"#00637e", pista:"#b8e2ed", t1:"#e6f4f8", t2:"#bde4ee", ancho:300, alto:112 },
                premiaya:  { prim:"#1b6b2e", texto:"#0f4a1e", pista:"#bfd6c4", t1:"#e8f0ea", t2:"#c4d9c9", ancho:300, alto:120 },
                cmu:       { prim:"#00468f", texto:"#002e5f", pista:"#b8cbe0", t1:"#e6ecf4", t2:"#bdcfe2", ancho:300, alto:112 },
                gerryit:   { prim:"#0084e0", texto:"#0063ab", pista:"#b8ddf6", t1:"#e6f3fc", t2:"#bddff7", ancho:288, alto:104 }
        };

        var temaPuesto = "";

        /**
         * Pinta la marca: colores y logo. Devuelve true si la aplico.
         * Solo acepta nombres que existan en TEMAS — asi un valor raro en la
         * URL no puede meter nada en la pagina.
         */
        function aplicarTema(nombre) {
                var clave = (nombre || "").toString().trim().toLowerCase();
                var t = TEMAS[clave];
                if (!t || clave === temaPuesto) return false;
                temaPuesto = clave;

                var raiz = document.documentElement.style;
                raiz.setProperty('--prim',  t.prim);
                raiz.setProperty('--texto', t.texto);
                raiz.setProperty('--pista', t.pista);
                raiz.setProperty('--t1',    t.t1);
                raiz.setProperty('--t2',    t.t2);

                var img = document.getElementById('logo');
                img.style.maxWidth  = t.ancho + 'px';
                img.style.maxHeight = t.alto  + 'px';
                img.onload  = function () { img.classList.add('visible'); };
                img.onerror = function () { img.classList.remove('visible'); }; // sin logo, la pagina sigue
                img.src = 'logos/' + clave + '.png';
                return true;
        }

        function mostrarError(msg, esBloqueo) {
                var cargando = document.getElementById('loading');
                if (cargando) cargando.style.display = 'none';

                var caja = document.getElementById('msgError');
                if (caja) caja.style.display = 'flex';

                var ico = document.getElementById('msgIcono');
                if (ico && esBloqueo) {
                        ico.innerHTML = '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>';
                }

                var txt = document.getElementById('msgTexto');
                if (txt) txt.textContent = msg;
        }

        /**
         * Arrastra al destino los parametros extra que traia la URL de entrada.
         * Se quitan 'k' (la clave del redireccionador) y 'm' (la marca): las
         * dos son de esta pagina y al destino no le sirven.
         */
        function conParametrosExtra(destino) {
                var entrada = new URLSearchParams(document.location.search);
                entrada.delete('k');
                entrada.delete('m');

                var extras = entrada.toString();
                if (!extras) return destino;

                var i     = destino.indexOf('#');
                var ancla = i === -1 ? ''      : destino.slice(i);
                var base  = i === -1 ? destino : destino.slice(0, i);

                var sep = base.indexOf('?') === -1 ? '?' : '&';
                return base + sep + extras + ancla;
        }

        // Si la URL trae la marca, se pinta ANTES de preguntarle nada a nadie.
        if (m) aplicarTema(m);

        if (k) {
                fetch(AS_URL_BASE + '?k=' + encodeURIComponent(k))
                  .then(function (r) { return r.text(); })
                  .then(function (r) {
                              if (!r) {
                                            mostrarError('Código QR no encontrado.');
                                            return;
                              }
                              if (r === 'inactivo') {
                                            mostrarError('Este QR está temporalmente desactivado.', true);
                                            return;
                              }

                              // "eurotecsa|https://..."  o  solo la URL
                              var partes = r.split('|');
                              if (partes.length >= 2) {
                                            var tema = partes[0];
                                            var url  = partes.slice(1).join('|');
                                            var cambio = aplicarTema(tema);
                                            // Si la marca ya venia pintada por &m=, no hay que esperar
                                            // tanto. Si acaba de cambiar, se le dan los 800 ms de antes.
                                            setTimeout(function () {
                                                            document.location.replace(conParametrosExtra(url));
                                            }, cambio ? 800 : 450);
                              } else {
                                            document.location.replace(conParametrosExtra(r));
                              }
                  })
                  .catch(function () {
                              mostrarError('Error de conexión. Vuelve a intentarlo.');
                  });
        } else {
                mostrarError('URL inválida: falta el parámetro k.');
        }
  </script>

</body>
</html>
