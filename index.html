<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando Proyecto...</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Fondo con degradado moderno y animación de pulso */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a2a6c, #b21f1f, #fdbb2d);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Contenedor del Logo/Icono */
    .logo-container {
      margin-bottom: 30px;
      font-size: 50px;
      text-shadow: 0 10px 20px rgba(0,0,0,0.3);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    /* Spinner Orbital Pro */
    .spinner {
      width: 80px;
      height: 80px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 15px rgba(255,255,255,0.5);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Texto de estado */
    .status-text {
      margin-top: 25px;
      font-size: 1.2rem;
      letter-spacing: 2px;
      font-weight: 300;
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* Barra de progreso sutil */
    .progress-bar {
      width: 200px;
      height: 2px;
      background: rgba(255,255,255,0.1);
      margin-top: 15px;
      position: relative;
      overflow: hidden;
    }
    .progress-bar::after {
      content: '';
      position: absolute;
      left: -100%;
      width: 100%;
      height: 100%;
      background: white;
      animation: loading 2s infinite;
    }

    @keyframes loading {
      0% { left: -100%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <i class="fa-solid fa-qrcode"></i>
  </div>

  <div class="spinner"></div>

  <div class="status-text">Validando Acceso</div>
  
  <div class="progress-bar"></div>


  
  <script>
        const AS_URL_BASE = "https://script.google.com/macros/s/AKfycbzeAUxnJlxfNX-rf4RLYVFVugskeTVyZ2JsNgJ6ZU7avt3tkckUZnYpxH1iDanvW02M/exec";

        // FIX: URLSearchParams captura k correctamente aunque haya mas parametros
        var params = new URLSearchParams(document.location.search);
        var k = params.get('k');

        // Dominio del visitante (para historial en Sheets)
        var dominio = window.location.hostname;

        // ─── TEMAS VISUALES POR MARCA ─────────────────────────────────────────
        // Cada marca definida en col G de QRDinamicos tiene su propio gradiente.
        // El Apps Script devuelve "tema|urlDestino" o solo "urlDestino".
        var TEMAS = {
                eurotecsa: {
                          bg: "radial-gradient(circle at center, #6b0000, #c0392b, #e74c3c)",
                          spinner: "#ffffff",
                          texto: "#ffffff"
                },
                gsi: {
                          bg: "radial-gradient(circle at center, #0d47a1, #1565c0, #1e88e5)",
                          spinner: "#ffffff",
                          texto: "#ffffff"
                },
                systemi: {
                          bg: "radial-gradient(circle at center, #004d40, #00695c, #00897b)",
                          spinner: "#ffffff",
                          texto: "#ffffff"
                },
                premiaya: {
                          bg: "radial-gradient(circle at center, #e65100, #f57c00, #ffa000)",
                          spinner: "#ffffff",
                          texto: "#ffffff"
                }
        };

        function aplicarTema(nombreTema) {
                var t = TEMAS[nombreTema] || null;
                if (!t) return; // sin tema: mantiene el gradiente default del CSS
                document.body.style.background = t.bg;
                document.body.style.backgroundSize = "400% 400%";
                // Cambiar color del spinner y barra al color del tema
                var spinner = document.querySelector('.spinner');
                if (spinner) spinner.style.borderLeftColor = t.spinner;
        }

        function mostrarError(icono, msg) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('msgError').style.display = 'flex';
                document.getElementById('msgIcono').className = 'fa-solid ' + icono;
                document.getElementById('msgTexto').innerHTML = msg;
        }

        if (k) {
                fetch(AS_URL_BASE + '?k=' + encodeURIComponent(k) + '&d=' + encodeURIComponent(dominio))
                  .then(r => r.text())
                  .then(r => {
                              if (!r) {
                                            mostrarError('fa-triangle-exclamation', 'Codigo QR no encontrado.');
                                            return;
                              }
                              if (r === 'inactivo') {
                                            mostrarError('fa-ban', 'Este QR esta temporalmente desactivado.');
                                            return;
                              }

                              // Detectar si viene con tema: "eurotecsa|https://..."
                              var partes = r.split('|');
                              if (partes.length >= 2) {
                                            var tema    = partes[0].toLowerCase().trim();
                                            var url     = partes.slice(1).join('|'); // por si la URL tiene | dentro
                                            aplicarTema(tema);
                                            // Breve pausa para que se vea el tema antes de redirigir
                                            setTimeout(function() {
                                                            document.location.replace(url);
                                            }, 800);
                              } else {
                                            // Sin tema: redirige directamente
                                            document.location.replace(r);
                              }
                  })
                  .catch(function() {
                              mostrarError('fa-triangle-exclamation', 'Error de conexion. Intenta de nuevo.');
                  });
        } else {
                mostrarError('fa-triangle-exclamation', 'URL invalida: falta el parametro k.');
        }
  </script>

      <!-- Mensaje de error / QR inactivo -->
      <div id="msgError" style="display:none; flex-direction:column; align-items:center; gap:12px;">
              <i id="msgIcono" class="fa-solid fa-triangle-exclamation" style="font-size:48px; opacity:0.85;"></i>
              <p id="msgTexto" style="font-size:1rem; letter-spacing:1px; opacity:0.9; text-align:center;">QR no disponible en este momento.</p>
      </div>

</body>
</html>
