<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando Proyecto...</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Fondo con degradado moderno y animación de pulso */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a2a6c, #b21f1f, #fdbb2d);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Contenedor del Logo/Icono */
    .logo-container {
      margin-bottom: 30px;
      font-size: 50px;
      text-shadow: 0 10px 20px rgba(0,0,0,0.3);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    /* Spinner Orbital Pro */
    .spinner {
      width: 80px;
      height: 80px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 15px rgba(255,255,255,0.5);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Texto de estado */
    .status-text {
      margin-top: 25px;
      font-size: 1.2rem;
      letter-spacing: 2px;
      font-weight: 300;
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* Barra de progreso sutil */
    .progress-bar {
      width: 200px;
      height: 2px;
      background: rgba(255,255,255,0.1);
      margin-top: 15px;
      position: relative;
      overflow: hidden;
    }
    .progress-bar::after {
      content: '';
      position: absolute;
      left: -100%;
      width: 100%;
      height: 100%;
      background: white;
      animation: loading 2s infinite;
    }

    @keyframes loading {
      0% { left: -100%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <i class="fa-solid fa-qrcode"></i>
  </div>

  <div class="spinner"></div>

  <div class="status-text">Validando Acceso</div>
  
  <div class="progress-bar"></div>


  
  <script>
    const AS_URL_BASE = "https://script.google.com/macros/s/AKfycby9dEfJ5nJD4XowjzKiKZ3NvsQHyzMw_8RjZmnMjSDoMDPYSwxAWHCpEgYbDtWRIYHT/exec";
    
        // FIX: URLSearchParams captura k correctamente aunque haya mas parametros
        var params = new URLSearchParams(document.location.search);
        var k = params.get('k');
        // OPCION B: Dominio del visitante para redireccion personalizada
        var dominio = window.location.hostname;
    
    if(k){
              fetch(AS_URL_BASE+'?k='+encodeURIComponent(k)+'&d='+encodeURIComponent(dominio))
      .then(r => r.text())
      .then((r) => {
          if (r && r !== 'inactivo') {
                        document.location.replace(r);
          } else if (r === 'inactivo') {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('msgError').style.display = 'flex';
                        document.getElementById('msgTexto').textContent = 'Este QR esta temporalmente desactivado.';
          }
      })
      .catch(err => console.log(err))
    }

  </script>
  
      <!-- Mensaje de error / QR inactivo -->
      <div id="msgError" style="display:none; flex-direction:column; align-items:center; gap:12px;">
              <i class="fa-solid fa-triangle-exclamation" style="font-size:48px; opacity:0.85;"></i>
              <p id="msgTexto" style="font-size:1rem; letter-spacing:1px; opacity:0.9; text-align:center;">QR no disponible en este momento.</p>
      </div>
  
  
</body>
</html>
